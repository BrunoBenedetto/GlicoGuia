<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#113d42" />
    <title>GlicoGuia | Seu glicosímetro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="device" aria-label="Simulador de glicosímetro GlicoGuia">
      <div class="device-top" aria-hidden="true"><span></span><i></i><span></span></div>
      <section class="screen" id="screen" data-brightness="100">
        <header class="status-bar">
          <span class="brand"><i aria-hidden="true">⌁</i> GlicoGuia</span>
          <span id="device-clock" aria-live="polite"></span>
          <span class="battery" aria-label="Bateria cheia"><i></i></span>
        </header>
        <div id="view" class="view" tabindex="-1"></div>
      </section>
      <div class="device-bottom" aria-hidden="true"><span class="home-indicator"></span></div>
    </main>
    <p class="privacy-note">Seus testes ficam salvos apenas neste navegador.</p>
    <script src="app.js"></script>
  </body>
</html>
